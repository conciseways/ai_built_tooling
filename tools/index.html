<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Card Games</title>
  <meta name="description" content="Simple card games for kids: adding, subtracting, and comparing playing cards." />
  <meta name="theme-color" content="#15203f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Card Games" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, #15203f, #0c1330);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    h1 { margin: 0 0 6px; font-size: clamp(30px, 7vw, 56px); }
    .lead { margin: 0 0 32px; opacity: 0.85; font-size: clamp(14px, 2.5vw, 18px); }

    .tiles {
      display: grid;
      grid-template-columns: repeat(3, minmax(160px, 1fr));
      gap: clamp(14px, 3vw, 28px);
      width: 100%;
      max-width: 880px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: clamp(20px, 4vw, 40px) 16px;
      border-radius: 22px;
      text-decoration: none;
      color: #fff;
      background: var(--c1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .tile:hover,
    .tile:focus-visible {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      outline: none;
    }

    .tile .icon { font-size: clamp(40px, 9vw, 72px); line-height: 1; }
    .tile .name { font-size: clamp(18px, 3.5vw, 26px); font-weight: 800; }
    .tile .desc { font-size: clamp(12px, 2.2vw, 14px); opacity: 0.9; }

    .adder    { --c1: #157347; }
    .subtract { --c1: #8e2466; }
    .higher   { --c1: #2f51a8; }

    .install-btn {
      margin-top: 28px;
      font: inherit;
      font-weight: 800;
      font-size: clamp(15px, 3vw, 18px);
      padding: 12px 26px;
      border-radius: 999px;
      border: 2px solid #ffd54a;
      background: transparent;
      color: #ffd54a;
      cursor: pointer;
    }

    @media (max-width: 620px) {
      .tiles { grid-template-columns: 1fr; max-width: 360px; }
    }
  </style>
</head>
<body>
  <h1>Math Card Games</h1>
  <p class="lead">Pick a game to play.</p>

  <nav class="tiles">
    <a class="tile adder" href="./card-adder/">
      <span class="icon" aria-hidden="true">&#10133;</span>
      <span class="name">Card Adder</span>
      <span class="desc">Practice adding two cards.</span>
    </a>

    <a class="tile subtract" href="./card-subtract/">
      <span class="icon" aria-hidden="true">&#10134;</span>
      <span class="name">Card Subtract</span>
      <span class="desc">Practice subtracting two cards.</span>
    </a>

    <a class="tile higher" href="./higher-card/">
      <span class="icon" aria-hidden="true">&#127183;</span>
      <span class="name">Higher Card</span>
      <span class="desc">Tap the bigger (or smaller) card.</span>
    </a>
  </nav>

  <button id="installBtn" class="install-btn" hidden>Install app</button>

  <script type="module" src="pwa.js"></script>
</body>
</html>
