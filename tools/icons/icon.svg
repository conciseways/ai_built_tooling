<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Math Card Games">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b294f"/>
      <stop offset="1" stop-color="#0c1330"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <!-- Suit symbols in a 100x100 box -->
    <path id="heart" d="M50 88 C 8 58, 6 26, 30 18 C 44 13, 50 24, 50 30 C 50 24, 56 13, 70 18 C 94 26, 92 58, 50 88 Z"/>
    <path id="spade" d="M50 12 C 70 40, 94 50, 94 68 C 94 83, 80 88, 70 83 C 66 81, 62 78, 60 74 C 61 84, 65 92, 74 96 L 26 96 C 35 92, 39 84, 40 74 C 38 78, 34 81, 30 83 C 20 88, 6 83, 6 68 C 6 50, 30 40, 50 12 Z"/>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Left card (spade) -->
  <g transform="rotate(-12 256 256)" filter="url(#shadow)">
    <rect x="120" y="150" width="180" height="246" rx="22" fill="#ffffff"/>
    <g transform="translate(150 205) scale(1.2)">
      <use href="#spade" fill="#16213a"/>
    </g>
  </g>

  <!-- Right card (heart) -->
  <g transform="rotate(11 256 256)" filter="url(#shadow)">
    <rect x="220" y="135" width="180" height="246" rx="22" fill="#ffffff"/>
    <g transform="translate(250 190) scale(1.2)">
      <use href="#heart" fill="#e0294a"/>
    </g>
  </g>

  <!-- Math badges -->
  <g>
    <circle cx="178" cy="150" r="42" fill="#ffd54a"/>
    <path d="M178 130 v40 M158 150 h40" stroke="#15203f" stroke-width="11" stroke-linecap="round"/>
    <circle cx="346" cy="372" r="42" fill="#ffd54a"/>
    <path d="M326 372 h40" stroke="#15203f" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
