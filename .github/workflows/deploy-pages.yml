name: Deploy Math Card Games to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Sync playing-cards package into tools/
        run: node scripts/sync-playing-cards.js

      - name: Upload tools/ folder as site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./tools

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
